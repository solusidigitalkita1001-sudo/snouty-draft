# SNOUTY — CI.
#
# Provider: GitHub Actions (OQ-09, 2026-10-05). Definisi job-nya netral, jadi pindah ke GitLab
# nanti berarti menukar satu berkas, bukan menulis ulang pipeline.
#
# CI TIDAK PERNAH terhubung ke MySQL bersama di 192.168.1.136 (SPEC §31c).
# Ditegakkan oleh scripts/check-ci-db-host.mjs, bukan hanya oleh konfigurasi.

name: CI

on:
  pull_request:
  push:
    # Kerja berjalan di branch per fase/item (`phase-<n>/<item>`), tidak pernah langsung di main —
    # tanpa ini CI tidak pernah berjalan sama sekali (P0e-05).
    branches: [main, 'phase-*/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  guards:
    name: Pagar arsitektur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks memindai seluruh riwayat, bukan hanya commit teratas.
          fetch-depth: 0
      # Skrip pagar Node murni tanpa dependensi: tanpa pnpm dan tanpa cache. Cache pnpm tanpa
      # `pnpm install` membuat langkah penutup setup-node gagal (run pertama CI, 2026-10-08).
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # packages/engineering harus tetap tanpa dependensi runtime (SPEC §8, §25).
      - run: node scripts/check-engineering-isolation.mjs

      # DB_HOST tidak boleh mengarah ke server bersama.
      - run: node scripts/check-ci-db-host.mjs

      # Secret tidak pernah masuk repositori (docs/SECURITY.md §10).
      - name: Pindai secret
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Tes
    runs-on: ubuntu-latest
    services:
      # MySQL sekali pakai untuk tes integrasi — bukan server bersama.
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: snouty_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # Redis sekali pakai: tes invalidasi cache katalog (P1-07a) menyentuh Redis
      # sungguhan, karena invalidasi yang diuji terhadap mock hanya membuktikan
      # mock-nya dipanggil.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: snouty_test
      DB_USERNAME: root
      DB_PASSWORD: test
      # Di CI port standar tidak bentrok dengan apa pun, jadi 6379 — bukan 6380
      # seperti di docker-compose lokal.
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-ci-db-host.mjs
      - run: pnpm test
      # Migration diuji terhadap MySQL sungguhan: constraint CHECK hanya bermakna
      # kalau database benar-benar menolak baris yang melanggarnya.
      - run: pnpm --filter @snouty/api test:migration

  build:
    name: Build web + api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Evaluasi AI (docs/EVALUATION.md §4): memanggil model SUNGGUHAN, jadi berbiaya dan
  # butuh kunci. Dinyalakan pemilik lewat variabel repositori EVAL_ENABLED=true plus
  # secret OPENROUTER_API_KEY (+ OPENROUTER_BASE_URL dan tiga LLM_MODEL_* sebagai
  # variabel). Tanpa itu job dilewati, bukan gagal. Berjalan hanya bila berkas terkait AI
  # berubah — pemeriksaan jalurnya di langkah pertama, karena filter `paths` GitHub hanya
  # ada di tingkat workflow.
  evals:
    name: Evaluasi AI
    if: ${{ vars.EVAL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Berkas terkait AI berubah?
        id: ai
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$base" HEAD | grep -Eq '^apps/api/(src/modules/(ai|context|policy)/|evals/|scripts/eval\.mjs)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.ai.outputs.changed == 'true'
      - uses: actions/setup-node@v4
        if: steps.ai.outputs.changed == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.ai.outputs.changed == 'true'
      - run: pnpm build:types && pnpm --filter @snouty/api build
        if: steps.ai.outputs.changed == 'true'
      - run: pnpm eval
        if: steps.ai.outputs.changed == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ vars.OPENROUTER_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LLM_MODEL_FAST: ${{ vars.LLM_MODEL_FAST }}
          LLM_MODEL_BALANCED: ${{ vars.LLM_MODEL_BALANCED }}
          LLM_MODEL_STRONG: ${{ vars.LLM_MODEL_STRONG }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.ai.outputs.changed == 'true'
        with:
          name: eval-results
          path: apps/api/evals/results/
