# SNOUTY — ai.pralon.co.id di balik Nginx (docs/INFRASTRUCTURE.md §3).
# Pasang:  sudo cp deploy/nginx/ai.pralon.co.id.conf /etc/nginx/sites-available/ai.pralon.co.id
#          sudo ln -s /etc/nginx/sites-available/ai.pralon.co.id /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# TLS:     sudo certbot --nginx -d ai.pralon.co.id   (menambah blok 443 + redirect sendiri)

upstream snouty_web { server 127.0.0.1:3000; }
upstream snouty_api { server 127.0.0.1:3001; }

server {
    listen 80;
    listen [::]:80;
    server_name ai.pralon.co.id;

    # Header keamanan dasar; CSP menyusul setelah aset luar (font) dipastikan.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # SSE: percakapan dan analisis dialirkan — tanpa ini seluruh jawaban baru muncul di akhir.
    location /api/v1/conversations/ {
        proxy_pass http://snouty_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://snouty_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 12m;
    }

    location /health {
        proxy_pass http://snouty_api/health;
    }

    location / {
        proxy_pass http://snouty_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
