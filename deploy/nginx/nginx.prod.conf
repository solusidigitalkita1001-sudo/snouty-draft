# SNOUTY — nginx di dalam compose (service `nginx`, image nginx:alpine), memegang 80/443 server.
#
# Mengapa di compose, bukan nginx host: di server 192.168.1.10 nginx host nonaktif dan 80/443 sudah
# dipegang kontainer nginx proyek lama yang JUGA melayani bagspace.pralon.co.id. Berkas ini menggantikan
# kontainer itu — blok bagspace disalin apa adanya supaya aplikasi lain tidak terputus.
#
# TLS dari /etc/letsencrypt host (bind mount, read-only); webroot certbot /var/www/certbot tetap dilayani.

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  upstream snouty_web { server web:3000; }
  upstream snouty_api { server api:3001; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

  # ── catch-all: nama host yang tidak dikenal ditutup ──
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }
  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/ai.pralon.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.pralon.co.id/privkey.pem;
    return 444;
  }

  # ── ai.pralon.co.id: HTTP → HTTPS + tantangan certbot ──
  server {
    listen 80;
    server_name ai.pralon.co.id;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  # ── ai.pralon.co.id: SNOUTY ──
  server {
    listen 443 ssl;
    http2 on;
    server_name ai.pralon.co.id;

    ssl_certificate     /etc/letsencrypt/live/ai.pralon.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.pralon.co.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # SSE: percakapan dan analisis dialirkan — tanpa ini jawaban baru muncul di akhir.
    location /api/v1/conversations/ {
      proxy_pass http://snouty_api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      add_header X-Accel-Buffering no;
    }

    location /api/ {
      proxy_pass http://snouty_api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      client_max_body_size 12m;
    }

    location = /health { proxy_pass http://snouty_api/health; }

    location / {
      proxy_pass http://snouty_web;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_read_timeout 300s;
    }
  }

  # ── bagspace.pralon.co.id: disalin dari nginx proyek lama, tidak diubah ──
  server {
    listen 80;
    server_name bagspace.pralon.co.id;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name bagspace.pralon.co.id;

    ssl_certificate /etc/letsencrypt/live/bagspace.pralon.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bagspace.pralon.co.id/privkey.pem;

    location = /ready {
      proxy_pass http://192.168.1.10:3478/ready;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      proxy_pass http://192.168.1.10:3478;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
      proxy_pass http://192.168.1.10:3478;
      proxy_http_version 1.1;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
    }

    location = /livekit { return 301 /livekit/; }

    location /livekit/ {
      proxy_pass http://192.168.1.10:7880/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
    }

    location / {
      proxy_pass http://192.168.1.10:2026;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
